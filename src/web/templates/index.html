<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xalqaro xatlar — rekvizitlar</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>Xalqaro xatlar <span>rekvizitlar va boshqarma</span></h1>
    <p class="note">Oflayn ishlaydi · PDF diskka yozilmaydi · faqat 1–6-sahifa o'qiladi</p>
  </header>

  <main>
    <form id="upload" class="panel upload">
      <label class="file">
        <span>Xat (PDF)</span>
        <input type="file" id="pdf" accept="application/pdf,.pdf" required>
      </label>
      <label class="file">
        <span>To'g'ri javob (json) — ixtiyoriy, solishtirish uchun</span>
        <input type="file" id="truth" accept="application/json,.json">
      </label>
      <button type="submit" id="run">Tahlil qilish</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>

    <section id="result" class="result" hidden>
      <div class="panel pages-panel">
        <div id="legend" class="legend"></div>
        <div id="pages" class="pages"></div>
      </div>

      <div class="panel fields-panel">
        <div id="meta" class="meta"></div>
        <div id="fields"></div>
        <details class="final">
          <summary>Yakuniy JSON (xodim tekshirgan qiymatlar)</summary>
          <pre id="json"></pre>
          <button type="button" id="copy" class="secondary">Nusxa olish</button>
        </details>
      </div>
    </section>
  </main>
</body>
</html>
