[project]
name = "xalqaro-xatlar"
version = "0.1.0"
description = "MDH xalqaro huquqiy yordam xatlaridan rekvizit va boshqarmani aniqlash (oflayn)"
authors = [
    {name = "ibrohim",email = "ibrohim.dev.uz@gmail.com"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pymupdf (>=2.0,<3.0)",
    "opencv-python-headless (>=5.0.0.93,<6.0.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "rapidfuzz (>=3.14.6,<4.0.0)",
    "fastapi (>=0.159.1,<0.160.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "reportlab (>=5.0.1,<6.0.0)",
    "rapidocr (>=3.10.0,<4.0.0)",
    "onnxruntime (>=1.31.0,<2.0.0)",
    "pyobjc-framework-vision (>=12.2.2,<13.0.0) ; sys_platform == \"darwin\""
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
